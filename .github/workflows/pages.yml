name: Deploy NecroticHollow to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Remove unwanted spark particles
        run: python3 remove-v19-spark-effects.py
      - name: Inject V20 music player
        run: python3 build-v20-music.py
      - name: Inject V21 gaming history section
        run: python3 build-v21-gaming.py
      - name: Apply V22 YBA tier list changes
        run: python3 build-v22-yba-tierlist.py
      - name: Load V22.14 gaming VFX overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          link = '<link rel="stylesheet" href="v22-14-overrides.css">'
          if link not in s:
              s = s.replace('</head>', f'  {link}\\n</head>', 1)
          p.write_text(s, encoding="utf-8")
          print("V22.14 stylesheet loaded")
          PY
      - name: Load V22.17 Project Matrix gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="v22-17-project-matrix.css">'
          js = '<script src="v22-17-project-matrix.js" defer></script>'
          if css not in s:
              s = s.replace('</head>', f'  {css}\\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', f'  {js}\\n</body>', 1)
          p.write_text(s, encoding="utf-8")
          print("V22.17 Project Matrix gallery loaded")
          PY
      - name: Add GOATD profile to Section 09 network
        run: python3 build-v23-network-links.py
      - name: Check visitor counter API (read-only)
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://counterapi.com/api/necrotichollow.sh/view/portfolio-v195?unique=true&startNumber=0&noFormatting=true&readOnly=true"
          try:
              request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "NecroticHollow-visitor-counter-healthcheck"})
              with urllib.request.urlopen(request, timeout=12) as response:
                  status = response.status
                  raw = response.read().decode("utf-8", "replace")
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  print(f"VISITOR_COUNTER_CHECK: HTTP {status}; response was not valid JSON: {raw[:400]}")
              else:
                  value = data.get("value") if isinstance(data, dict) else None
                  if isinstance(value, (int, float)) and not isinstance(value, bool):
                      print(f"VISITOR_COUNTER_CHECK: HEALTHY; HTTP {status}; numeric value={value}")
                  else:
                      print(f"VISITOR_COUNTER_CHECK: HTTP {status}; unexpected response shape: {str(data)[:400]}")
          except Exception as exc:
              print(f"VISITOR_COUNTER_CHECK: FAILED; {type(exc).__name__}: {exc}")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
