name: Deploy NecroticHollow to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Remove unwanted spark particles
        run: python3 remove-v19-spark-effects.py
      - name: Inject V20 music player
        run: python3 build-v20-music.py
      - name: Inject V21 gaming history section
        run: python3 build-v21-gaming.py
      - name: Apply V22 YBA tier list changes
        run: python3 build-v22-yba-tierlist.py
      - name: Load V22.14 gaming VFX overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          link = '<link rel="stylesheet" href="v22-14-overrides.css">'
          if link not in s:
              s = s.replace('</head>', f'  {link}\\n</head>', 1)
          p.write_text(s, encoding="utf-8")
          print("V22.14 stylesheet loaded")
          PY
      - name: Load V22.17 Project Matrix gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="v22-17-project-matrix.css">'
          js = '<script src="v22-17-project-matrix.js" defer></script>'
          if css not in s:
              s = s.replace('</head>', f'  {css}\\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', f'  {js}\\n</body>', 1)
          p.write_text(s, encoding="utf-8")
          print("V22.17 Project Matrix gallery loaded")
          PY
      - name: Add GOATD profile to Section 09 network
        run: python3 build-v23-network-links.py
      - name: Apply visitor counter fix
        run: python3 build-v24-visitor-counter.py
      - name: Diagnose visitor counter options (read-only)
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          tests = [
              ("json API read-only", "https://counterapi.com/api/necrotichollow.sh/view/portfolio-v195?readOnly=true&startNumber=0&noFormatting=true"),
              ("JSONP API read-only", "https://counterapi.com/api/necrotichollow.sh/view/portfolio-v195?readOnly=true&startNumber=0&noFormatting=true&callback=nhCounterHealthCheck"),
              ("SVG badge read-only", "https://counterapi.com/counter.svg?ns=necrotichollow.sh&action=view&key=portfolio-v195&readOnly=true&noLink=true&noFormatting=true&label=visitors&color=ff4774&labelColor=140613"),
              ("official embed script", "https://counterapi.com/c.js"),
          ]

          for label, url in tests:
              try:
                  request = urllib.request.Request(url, headers={"Accept": "*/*", "User-Agent": "NecroticHollow-visitor-counter-healthcheck"})
                  with urllib.request.urlopen(request, timeout=5) as response:
                      status = response.status
                      content_type = response.headers.get("Content-Type", "")
                      raw = response.read(600).decode("utf-8", "replace")
                  summary = "responded"
                  if "json" in content_type.lower():
                      try:
                          payload = json.loads(raw)
                          if isinstance(payload, dict) and isinstance(payload.get("value"), (int, float)):
                              summary = f"numeric count value={payload['value']}"
                          else:
                              summary = f"unexpected JSON: {str(payload)[:140]}"
                      except json.JSONDecodeError:
                          summary = f"invalid JSON: {raw[:140]}"
                  elif "svg" in content_type.lower() or raw.lstrip().startswith("<svg"):
                      summary = "SVG badge returned"
                  elif "javascript" in content_type.lower() or label == "official embed script":
                      summary = "script returned: " + raw[:400]
                  elif label == "JSONP API read-only":
                      summary = f"JSONP body begins: {raw[:140]}"
                  print(f"VISITOR_COUNTER_CHECK: {label}: HTTP {status}; {content_type}; {summary}")
              except Exception as exc:
                  print(f"VISITOR_COUNTER_CHECK: {label}: FAILED; {type(exc).__name__}: {exc}")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
